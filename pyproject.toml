[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selfecho-ai"
version = "0.6.0"
description = "MVP foundation for an AI-powered personal recorder and reminder system"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23.1,<26.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.10,<3.0",
  "pywebpush==2.4.0",
  "python-dotenv>=1.0,<2.0",
  "requests>=2.32,<3.0",
  "tencentcloud-sdk-python-ses==3.1.135",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["app"]
